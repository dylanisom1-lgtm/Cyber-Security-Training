<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Admin — Cyber Security Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a10;--bgP:rgba(8,14,28,.92);--bgC:rgba(12,20,38,.75);--red:#ff2d55;--blue:#00d4ff;--grn:#00ff41;--prp:#bf5af2;--amb:#ff9f0a;--tx:#dfe6f0;--tx2:#8892a4;--tx3:#3e4a5c;--brd:rgba(255,255,255,.06);--fD:'Orbitron',sans-serif;--fB:'Rajdhani',sans-serif;--fM:'Share Tech Mono',monospace}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--fB);line-height:1.6;min-height:100vh}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);pointer-events:none;z-index:9999}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--blue);border-radius:3px}

.gridBg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.02) 1px,transparent 1px);background-size:55px 55px;pointer-events:none}

h1,h2,h3,h4{font-family:var(--fD);font-weight:700;letter-spacing:.04em;line-height:1.2}
.mono{font-family:var(--fM)}

.wrap{max-width:1100px;margin:0 auto;padding:20px}
.header{text-align:center;padding:40px 20px 20px}
.header h1{font-size:clamp(1.4rem,3vw,2rem);margin-bottom:4px;background:linear-gradient(135deg,var(--blue),var(--grn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{font-family:var(--fM);font-size:.75rem;color:var(--tx3);letter-spacing:.15em}

.badge{display:inline-block;padding:3px 10px;font-family:var(--fM);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;border:1px solid}
.bdG{color:var(--grn);border-color:var(--grn);background:rgba(0,255,65,.08)}
.bdR{color:var(--red);border-color:var(--red);background:rgba(255,45,85,.08)}
.bdB{color:var(--blue);border-color:var(--blue);background:rgba(0,212,255,.08)}
.bdA{color:var(--amb);border-color:var(--amb);background:rgba(255,159,10,.08)}

/* Auth */
.auth{display:flex;align-items:center;justify-content:center;min-height:80vh;text-align:center}
.auth-box{max-width:400px;width:100%}
.inp{width:100%;padding:11px 14px;background:rgba(0,4,14,.7);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--tx);font-family:var(--fM);font-size:.92rem;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 12px rgba(0,212,255,.15)}
.inp::placeholder{color:var(--tx3);font-family:var(--fB)}
.btn{display:inline-block;padding:12px 30px;font-family:var(--fD);font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid;border-radius:2px;cursor:pointer;transition:all .3s;background:transparent}
.bG{color:var(--grn);border-color:var(--grn);box-shadow:0 0 10px rgba(0,255,65,.2)}.bG:hover{background:rgba(0,255,65,.1)}
.bB{color:var(--blue);border-color:var(--blue);box-shadow:0 0 10px rgba(0,212,255,.2)}.bB:hover{background:rgba(0,212,255,.1)}
.bR{color:var(--red);border-color:var(--red)}.bR:hover{background:rgba(255,45,85,.1)}
.bSm{padding:8px 18px;font-size:.65rem}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--brd);margin-bottom:24px}
.tab{padding:10px 22px;font-family:var(--fD);font-size:.68rem;letter-spacing:.12em;color:var(--tx3);cursor:pointer;border:none;border-bottom:2px solid transparent;transition:all .2s;background:none}
.tab:hover{color:var(--tx2)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--bgP);border:1px solid var(--brd);border-radius:4px;padding:18px;text-align:center}
.stat-val{font-family:var(--fD);font-size:2rem;font-weight:700;display:block}
.stat-lbl{font-family:var(--fM);font-size:.6rem;color:var(--tx3);letter-spacing:.1em;margin-top:4px;display:block}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{font-family:var(--fD);font-size:.6rem;letter-spacing:.1em;color:var(--tx3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--brd);text-transform:uppercase;cursor:pointer;user-select:none;transition:color .2s}
.tbl th:hover{color:var(--blue)}
.tbl th.sorted{color:var(--blue)}
.tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.tbl tr:hover td{background:rgba(0,212,255,.02)}
.tbl tr{cursor:pointer}

/* Risk badges */
.risk{display:inline-block;padding:2px 8px;border-radius:2px;font-family:var(--fM);font-size:.65rem;letter-spacing:.05em;font-weight:700}
.risk-low{color:var(--grn);border:1px solid rgba(0,255,65,.3);background:rgba(0,255,65,.06)}
.risk-mod{color:var(--amb);border:1px solid rgba(255,159,10,.3);background:rgba(255,159,10,.06)}
.risk-high{color:#ff6b35;border:1px solid rgba(255,107,53,.3);background:rgba(255,107,53,.06)}
.risk-crit{color:var(--red);border:1px solid rgba(255,45,85,.3);background:rgba(255,45,85,.06)}

/* Progress bar */
.bar{height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:3px;transition:width .5s}

/* Detail panel */
.detail{background:var(--bgC);border:1px solid var(--brd);border-radius:4px;padding:20px;margin-top:16px;display:none}
.detail.open{display:block}
.detail h3{margin-bottom:14px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.82rem;border-bottom:1px solid rgba(255,255,255,.03)}
.detail-row:last-child{border-bottom:none}
.detail-section{margin-bottom:16px}
.detail-section-title{font-family:var(--fM);font-size:.6rem;letter-spacing:.12em;color:var(--tx3);margin-bottom:8px;text-transform:uppercase}

/* Heatmap */
.hm-row{margin-bottom:12px}
.hm-label{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px}

/* Panel */
.panel{background:var(--bgP);border:1px solid var(--brd);border-radius:4px;padding:20px;margin-bottom:16px}
.panel-r{border-color:rgba(255,45,85,.15)}

/* Refresh indicator */
.refresh{position:fixed;top:12px;right:16px;font-family:var(--fM);font-size:.65rem;color:var(--tx3);display:flex;align-items:center;gap:6px;z-index:100}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.refresh button{background:none;border:1px solid var(--tx3);color:var(--tx3);font-family:var(--fM);font-size:.6rem;padding:3px 8px;border-radius:2px;cursor:pointer;transition:all .2s}
.refresh button:hover{border-color:var(--blue);color:var(--blue)}


/* Needs Attention badges */
.attn-tag{display:inline-block;padding:2px 7px;border-radius:2px;font-family:var(--fM);font-size:.55rem;letter-spacing:.04em;margin-left:4px}
.attn-incomplete{color:var(--amb);border:1px solid rgba(255,159,10,.3);background:rgba(255,159,10,.06)}
.attn-lowscore{color:var(--red);border:1px solid rgba(255,45,85,.3);background:rgba(255,45,85,.06)}
.attn-nodef{color:var(--blue);border:1px solid rgba(0,212,255,.3);background:rgba(0,212,255,.06)}

/* Question difficulty bars */
.qdiff{margin-bottom:14px;padding:12px 16px;background:var(--bgC);border-radius:4px;border-left:3px solid var(--brd)}
.qdiff-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.qdiff-q{font-size:.82rem;flex:1;margin-right:12px}
.qdiff-pct{font-family:var(--fD);font-size:.85rem;font-weight:700;flex-shrink:0}

/* Print summary */
.print-frame{background:#fff;color:#1a1a2e;padding:40px;border-radius:4px;max-width:800px;margin:0 auto}
.print-frame h1{color:#1a1a2e;font-size:1.3rem;margin-bottom:4px}
.print-frame h2{color:#1a1a2e;font-size:1rem;margin-bottom:10px;border-bottom:2px solid #1a1a2e;padding-bottom:6px}
.print-frame table{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:16px}
.print-frame th{background:#f0f0f5;padding:6px 8px;text-align:left;font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid #ddd}
.print-frame td{padding:5px 8px;border-bottom:1px solid #eee}
.print-frame .p-stats{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.print-frame .p-stat{text-align:center;flex:1;min-width:100px}
.print-frame .p-stat-val{font-size:1.8rem;font-weight:700;display:block}
.print-frame .p-stat-lbl{font-size:.6rem;letter-spacing:.08em;color:#666;text-transform:uppercase}
.print-frame .p-risk-low{color:#16a34a}.print-frame .p-risk-mod{color:#d97706}.print-frame .p-risk-high{color:#ea580c}.print-frame .p-risk-crit{color:#dc2626}
.print-frame .p-bar{height:8px;background:#f0f0f5;border-radius:4px;overflow:hidden;margin:4px 0}
.print-frame .p-bar-fill{height:100%;border-radius:4px}
.print-frame .p-vuln{padding:4px 8px;border-radius:3px;font-size:.7rem;font-weight:700}
.print-btn-bar{display:flex;gap:8px;justify-content:center;margin-bottom:20px}

@media print{
  body{background:#fff!important}
  body::after{display:none!important}
  .gridBg,.refresh,.tabs,.print-btn-bar{display:none!important}
  .header{display:none!important}
  .wrap{max-width:100%;padding:0}
  .print-frame{box-shadow:none;padding:20px}
  #tabPrint{display:block!important}
  #tabOverview,#tabRoster,#tabExport,#tabNeeds,#tabDifficulty{display:none!important}
}






/* Info tooltips */
.info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);color:var(--blue);font-family:var(--fM);font-size:.55rem;cursor:help;position:relative;margin-left:6px;vertical-align:middle;flex-shrink:0;font-style:normal;font-weight:700;line-height:1}
.info:hover{background:rgba(0,212,255,.18)}
.info-tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(6,10,20,.96);border:1px solid rgba(0,212,255,.25);border-radius:4px;padding:10px 14px;font-family:var(--fB);font-size:.78rem;font-weight:400;color:var(--tx2);line-height:1.5;min-width:220px;max-width:320px;z-index:3000;box-shadow:0 4px 20px rgba(0,0,0,.5);white-space:normal;text-align:left;pointer-events:none}
.info-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(0,212,255,.25)}
.info:hover .info-tip{display:block}
@media(max-width:700px){.info-tip{min-width:180px;max-width:260px;left:auto;right:0;transform:none}.info-tip::after{left:auto;right:12px}}

/* SVG Charts */
.chart-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.chart-card{flex:1;min-width:260px;background:var(--bgP);border:1px solid var(--brd);border-radius:4px;padding:20px;text-align:center}
.chart-card h4{font-family:var(--fD);font-size:.7rem;letter-spacing:.1em;color:var(--tx3);margin-bottom:14px}
.donut-svg{width:160px;height:160px;margin:0 auto;display:block}
.donut-ring{fill:none;stroke:rgba(255,255,255,.04);stroke-width:14}
.donut-seg{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.donut-center{font-family:var(--fD);fill:var(--tx);font-weight:700}
.donut-label{font-family:var(--fM);font-size:8px;fill:var(--tx3)}
.donut-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px;font-size:.72rem}
.donut-legend span{display:flex;align-items:center;gap:4px}
.donut-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.gauge-svg{width:200px;height:120px;margin:0 auto;display:block}
.gauge-bg{fill:none;stroke:rgba(255,255,255,.04);stroke-width:16;stroke-linecap:round}
.gauge-fill{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}
.gauge-label{font-family:var(--fD);fill:var(--tx);font-weight:700;text-anchor:middle}
.gauge-sub{font-family:var(--fM);font-size:9px;fill:var(--tx3);text-anchor:middle}
.radar-svg{width:240px;height:240px;margin:0 auto;display:block}
.radar-grid{fill:none;stroke:rgba(255,255,255,.06);stroke-width:.5}
.radar-area{fill:rgba(0,212,255,.1);stroke:var(--blue);stroke-width:1.5}
.radar-dot{fill:var(--blue);stroke:var(--bg);stroke-width:2}
.radar-label{font-family:var(--fM);font-size:8px;fill:var(--tx2);text-anchor:middle}


/* Collapsible modules */
.mod-collapse{cursor:pointer;transition:all .2s}
.mod-collapse:hover{border-color:rgba(0,212,255,.15)}
.mod-collapse-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.mod-collapse.open .mod-collapse-body{max-height:2000px}
.mod-collapse-arrow{transition:transform .3s;display:inline-block;margin-right:6px;font-size:.7rem;color:var(--tx3)}
.mod-collapse.open .mod-collapse-arrow{transform:rotate(90deg)}

/* Roster filters & bulk */
.roster-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.roster-search{flex:1;min-width:180px;padding:8px 12px;background:rgba(0,4,14,.7);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--tx);font-family:var(--fM);font-size:.82rem;outline:none}
.roster-search:focus{border-color:var(--blue)}
.roster-search::placeholder{color:var(--tx3)}
.roster-filter{padding:8px 10px;background:rgba(0,4,14,.7);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--tx);font-family:var(--fM);font-size:.78rem;outline:none;cursor:pointer;min-width:120px}
.roster-filter:focus{border-color:var(--blue)}
.roster-filter option{background:#0a0e14;color:var(--tx)}
.bulk-bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:rgba(0,212,255,.04);border:1px solid rgba(0,212,255,.15);border-radius:3px;margin-bottom:14px;flex-wrap:wrap}
.bulk-bar .bulk-count{font-family:var(--fM);font-size:.78rem;color:var(--blue);margin-right:auto}
.tbl input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px;cursor:pointer}
.tbl th.chk-col,td.chk-col{width:30px;text-align:center;padding:8px 6px}

/* Editable detail fields */
.edit-field{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.edit-field:last-child{border-bottom:none}
.edit-field label{font-size:.78rem;color:var(--tx2);min-width:80px;flex-shrink:0}
.edit-field input{flex:1;padding:6px 10px;background:rgba(0,4,14,.7);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--tx);font-family:var(--fM);font-size:.8rem;outline:none}
.edit-field input:focus{border-color:var(--blue)}
.edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Enrollment */
.enroll-form{display:grid;grid-template-columns:2fr 1fr 2fr 1fr;gap:8px;margin-bottom:12px;align-items:end}
.enroll-form label{font-family:var(--fM);font-size:.6rem;color:var(--tx3);letter-spacing:.08em;display:block;margin-bottom:3px}
.enroll-form input{padding:8px 10px;background:rgba(0,4,14,.7);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--tx);font-family:var(--fM);font-size:.82rem;outline:none;width:100%}
.enroll-form input:focus{border-color:var(--blue)}
.enroll-form input::placeholder{color:var(--tx3);font-family:var(--fB)}
.csv-zone{border:2px dashed var(--brd);border-radius:6px;padding:28px;text-align:center;cursor:pointer;transition:all .3s;margin:16px 0}
.csv-zone:hover{border-color:var(--blue);background:rgba(0,212,255,.02)}
.csv-zone input{display:none}
.enroll-count{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.enroll-count .stat{flex:1;min-width:120px}

@media(max-width:700px){
  .enroll-form{grid-template-columns:1fr;gap:6px}
}

/* Export bar */
.export-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}

.hidden{display:none}

@media(max-width:700px){
  .stats{grid-template-columns:1fr 1fr}
  .tbl{font-size:.75rem}
  .wrap{padding:12px}
}

/* ═══════ CLEAN PROFESSIONAL THEME ═══════ */
body.clean{
  --bg:#f5f6fa;--bgP:#ffffff;--bgC:#ffffff;
  --red:#dc2626;--blue:#2563eb;--grn:#16a34a;--prp:#7c3aed;--amb:#d97706;
  --tx:#1e293b;--tx2:#475569;--tx3:#94a3b8;
  --brd:rgba(0,0,0,.08);
  --fD:'Rajdhani',sans-serif;--fB:'Rajdhani',sans-serif;--fM:'Rajdhani',sans-serif;
}
body.clean{background:var(--bg);color:var(--tx)}
body.clean::after{display:none!important}
body.clean .gridBg{display:none}
body.clean ::-webkit-scrollbar-track{background:var(--bg)}
body.clean ::-webkit-scrollbar-thumb{background:#cbd5e1}
body.clean h1,body.clean h2,body.clean h3,body.clean h4{font-family:'Rajdhani',sans-serif;letter-spacing:.01em}
body.clean .header h1{background:none;-webkit-text-fill-color:var(--blue);color:var(--blue)}
body.clean .btn{border-radius:6px;font-family:'Rajdhani',sans-serif;letter-spacing:.06em;box-shadow:none!important}
body.clean .bG{background:var(--grn);color:#fff;border-color:var(--grn)}body.clean .bG:hover{background:#15803d}
body.clean .bB{background:var(--blue);color:#fff;border-color:var(--blue)}body.clean .bB:hover{background:#1d4ed8}
body.clean .bR{background:var(--red);color:#fff;border-color:var(--red)}body.clean .bR:hover{background:#b91c1c}
body.clean .stat{background:#fff;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
body.clean .panel{background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
body.clean .panel-r{border-color:#fecaca;background:#fef2f2}
body.clean .tbl th{color:#64748b}
body.clean .tbl tr:hover td{background:#f8fafc}
body.clean .inp{background:#fff;border:1px solid #cbd5e1;border-radius:6px;color:#1e293b}
body.clean .inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
body.clean .tabs{border-bottom:1px solid #e2e8f0}
body.clean .tab{color:#64748b}
body.clean .tab:hover{color:#334155}
body.clean .tab.on{color:var(--blue);border-bottom-color:var(--blue)}
body.clean .detail{background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
body.clean .risk{border-radius:4px}
body.clean .chart-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
body.clean .donut-center{fill:#1e293b}
body.clean .donut-label{fill:#64748b}
body.clean .donut-ring{stroke:#f1f5f9}
body.clean .gauge-bg{stroke:#f1f5f9}
body.clean .gauge-label{fill:#1e293b}
body.clean .gauge-sub{fill:#64748b}
body.clean .radar-grid{stroke:rgba(0,0,0,.08)}
body.clean .radar-area{fill:rgba(37,99,235,.08);stroke:var(--blue)}
body.clean .radar-dot{fill:var(--blue);stroke:#fff}
body.clean .radar-label{fill:#475569}
body.clean .bar{background:#f1f5f9}
body.clean .auth-box .inp{background:#fff}
body.clean .roster-search{background:#fff;border:1px solid #cbd5e1;border-radius:6px;color:#1e293b}
body.clean .roster-filter{background:#fff;border:1px solid #cbd5e1;border-radius:6px;color:#1e293b}
body.clean .roster-filter option{background:#fff;color:#1e293b}
body.clean .bulk-bar{background:#eff6ff;border:1px solid #bfdbfe}
body.clean .csv-zone{border:2px dashed #cbd5e1;border-radius:8px}
body.clean .csv-zone:hover{border-color:var(--blue);background:#eff6ff}
body.clean .edit-field input{background:#fff;border:1px solid #cbd5e1;border-radius:6px;color:#1e293b}
body.clean .mod-collapse{background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

<script>
// ═══════ CONFIG ═══════
const API='api.ashx';

// Theme toggle
function admToggleTheme(){
  document.body.classList.toggle('clean');
  const isClean=document.body.classList.contains('clean');
  const btn=document.getElementById('admThemeToggle');
  btn.textContent='☀';
  btn.style.color=isClean?'#d97706':'#fff';
  btn.title=isClean?'Switch to cyber theme':'Switch to clean theme';
  try{localStorage.setItem('admin_theme',isClean?'clean':'cyber')}catch(e){}
}
// Default to clean
(function(){
  try{
    const saved=localStorage.getItem('admin_theme');
    const btn=document.getElementById('admThemeToggle');
    btn.textContent='☀';
    if(saved==='cyber'){
      btn.style.color='#fff';
      btn.title='Switch to clean theme';
    } else {
      document.body.classList.add('clean');
      btn.style.color='#d97706';
      btn.title='Switch to cyber theme';
    }
  }catch(e){document.body.classList.add('clean')}
})();

const TRAINING_URL='http://192.168.3.48/training/cyber_training_v3.html';
const ADMIN_HASH='YWRtaW4='; // base64 of 'admin' — must match training app

let DATA={};
let sortCol='combined';
let sortDir='desc';
let filterText='';
let filterProp='';
let filterStatus='';
let selectedNames=new Set();

// ═══════ AUTH ═══════
function login(){
  const pw=document.getElementById('pw').value;

  }
}

// ═══════ DATA LOADING ═══════
function loadData(){

      renderAll();
    })

      document.getElementById('lastUpdate').textContent='Error: '+e.message;

}

// ═══════ TABS ═══════
function switchTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  ['Overview','Roster','Needs','Difficulty','Enroll','Export','Print'].forEach(t=>{
    document.getElementById('tab'+t).classList.toggle('hidden',t.toLowerCase()!==tab);
  });
  if(tab==='print')renderPrintReport(Object.values(DATA));
}

// ═══════ RISK SCORING ═══════
const POSTURE_QS=['Password Reuse','MFA Usage','Password Manager','Link Handling','AI Data Hygiene','Social Media Exposure'];
const POSTURE_GOOD={0:'never',1:'app',2:'dedicated',3:'navigate',4:'no',5:'minimal'};
const POSTURE_SCORES={
  0:{always:0,sometimes:50,never:100},
  1:{none:0,sms:50,app:100},
  2:{no:0,browser:50,dedicated:100},
  3:{click:0,hover:50,navigate:100},
  4:{yes:0,maybe:50,no:100},
  5:{lots:0,some:50,minimal:100}
};
const POSTURE_LABELS={always:'Reuses all',sometimes:'Some overlap',never:'All unique',none:'No MFA',sms:'SMS only',app:'App/hardware key',no:'None',browser:'Browser built-in',dedicated:'Dedicated app',click:'Clicks directly',hover:'Hovers first',navigate:'Navigates directly',yes:'Yes',maybe:'Possibly',lots:'Lots public',some:'Some basics',minimal:'Minimal/private'};
const MOD_NAMES={atk:{1:'Phishing Psychology & Cognitive Biases',2:'Password Predictability & Target Profiling',3:'Social Engineering & Psychological Triggers',4:'AI-Powered Cybercrime Economics'},def:{1:'Network Interception & Encryption',2:'Data Breaches & Modern Authentication',3:'Phishing/Deepfake Detection',4:'AI-Specific Threats & Defenses'}};

function calcPostureAgg(profiles){
  return POSTURE_QS.map((q,i)=>{
    let totalScore=0,count=0;
    profiles.forEach(p=>{
      if(p.def&&p.def.dAns&&p.def.dAns[i]!==null){
        count++;
        const ans=p.def.dAns[i];
        totalScore+=(POSTURE_SCORES[i]&&POSTURE_SCORES[i][ans]!==undefined)?POSTURE_SCORES[i][ans]:0;
      }
    });
    return{question:q,count,pct:count>0?Math.round(totalScore/count):0};
  });
}

const BADGE_DEFS={
  atk:{1:{i:'📧',n:'Inbox Psychologist'},2:{i:'🔓',n:'Password Profiler'},3:{i:'🎭',n:'Master Manipulator'},4:{i:'🤖',n:'AI Strategist'}},
  def:{1:{i:'📡',n:'Signal Guardian'},2:{i:'🛡️',n:'Vault Keeper'},3:{i:'🎭',n:'Deception Detector'},4:{i:'🤖',n:'AI Sentinel'}}
};

function calcRisk(p){
  let score=0;
  if(p.def&&p.def.dAns&&p.def.dAns.some(a=>a!==null)){
    const vm={always:3,sometimes:1,never:0,none:3,sms:1,app:0,no:3,browser:1,dedicated:0,click:3,hover:1,navigate:0,yes:3,maybe:2,lots:3,some:1,minimal:0};
    const vuln=(p.def.dAns||[]).reduce((s,a)=>s+(vm[a]||0),0);
    score+=(vuln/18)*50;
  }
  let tc=0,tq=0;
  ['atk','def'].forEach(r=>{
    if(!p[r]||!p[r].modRes)return;
    for(let m=1;m<=4;m++){const res=p[r].modRes[m];if(res){tc+=res.correct;tq+=res.total}}
  });
  if(tq>0)score+=(1-tc/tq)*30;else score+=30;
  const ad=p.atk&&p.atk.finished,dd=p.def&&p.def.finished;
  if(!ad&&!dd)score+=20;else if(!ad||!dd)score+=10;
  return Math.round(score);
}

function riskCls(s){return s<=25?'low':s<=45?'mod':s<=70?'high':'crit'}
function riskLbl(s){return s<=25?'LOW':s<=45?'MODERATE':s<=70?'HIGH':'CRITICAL'}
function riskCol(s){return s<=25?'var(--grn)':s<=45?'var(--amb)':s<=70?'#ff6b35':'var(--red)'}
function score(p){return (p.atk?p.atk.score||0:0)+(p.def?p.def.score||0:0)}

function getBadges(p){
  const b=[];
  ['atk','def'].forEach(r=>{
    const s=p[r];if(!s||!s.modRes)return;
    for(let m=1;m<=4;m++){
      const res=s.modRes[m],def=BADGE_DEFS[r][m];
      if(!def)continue;
      b.push({role:r,mod:m,icon:def.i,name:def.n,earned:res&&res.correct===res.total&&res.total>0,correct:res?res.correct:0,total:res?res.total:0});
    }
  });
  return b;
}

// ═══════ RENDER ALL ═══════
function renderAll(){

// ═══════ TOOLTIP HELPER ═══════
function tip(text){return `<i class="info">?<span class="info-tip">${text}</span></i>`}

// ═══════ SVG CHART UTILITIES ═══════
function svgDonut(segments, centerText, centerSub, size=160){
  const r=65,circ=2*Math.PI*r;
  let offset=0;
  const total=segments.reduce((s,seg)=>s+seg.value,0);
  if(total===0)return `<svg class="donut-svg" viewBox="0 0 ${size} ${size}"><circle class="donut-ring" cx="${size/2}" cy="${size/2}" r="${r}"/><text class="donut-center" x="${size/2}" y="${size/2}" text-anchor="middle" dy=".1em" font-size="24">0</text></svg>`;

  let arcs='';
  segments.forEach(seg=>{
    const pct=seg.value/total;
    const dash=pct*circ;
    const gap=circ-dash;
    arcs+=`<circle class="donut-seg" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${seg.color}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size/2} ${size/2})" style="filter:drop-shadow(0 0 4px ${seg.color}40)"/>`;
    offset+=dash;
  });

  const legend=segments.filter(s=>s.value>0).map(s=>`<span><i style="background:${s.color}"></i>${s.label}: ${s.value}</span>`).join('');

  return `<svg class="donut-svg" viewBox="0 0 ${size} ${size}">
    <circle class="donut-ring" cx="${size/2}" cy="${size/2}" r="${r}"/>
    ${arcs}
    <text class="donut-center" x="${size/2}" y="${size/2-6}" text-anchor="middle" font-size="28">${centerText}</text>
    <text class="donut-label" x="${size/2}" y="${size/2+10}" text-anchor="middle">${centerSub}</text>
  </svg><div class="donut-legend">${legend}</div>`;
}

function svgGauge(value, maxVal, label, color, sub){
  const r=50,startAngle=-180,endAngle=0;
  const circ=Math.PI*r; // half circle
  const pct=Math.min(value/maxVal,1);
  const dash=pct*circ;
  const cx=100,cy=95;
  return `<svg class="gauge-svg" viewBox="0 0 200 120">
    <path class="gauge-bg" d="M ${cx-r},${cy} A ${r},${r} 0 0,1 ${cx+r},${cy}"/>
    <path class="gauge-fill" d="M ${cx-r},${cy} A ${r},${r} 0 0,1 ${cx+r},${cy}" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${circ-dash}" style="filter:drop-shadow(0 0 6px ${color}60)"/>
    <text class="gauge-label" x="${cx}" y="${cy-10}" font-size="28">${label}</text>
    <text class="gauge-sub" x="${cx}" y="${cy+8}">${sub}</text>
  </svg>`;
}

function svgRadar(axes, values, size=240){
  const cx=size/2,cy=size/2,r=85;
  const n=axes.length;
  if(n<3)return '';
  const angle=i=>(2*Math.PI*i/n)-Math.PI/2;
  const point=(i,v)=>{const a=angle(i);return[(cx+r*v*Math.cos(a)).toFixed(1),(cy+r*v*Math.sin(a)).toFixed(1)]};

  // Grid rings
  let grid='';
  [.25,.5,.75,1].forEach(lv=>{
    const pts=Array.from({length:n},(_,i)=>point(i,lv).join(',')).join(' ');
    grid+=`<polygon class="radar-grid" points="${pts}"/>`;
  });
  // Grid spokes
  for(let i=0;i<n;i++){
    const[x,y]=point(i,1);
    grid+=`<line class="radar-grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
  }

  // Data polygon
  const dataPts=values.map((v,i)=>point(i,v/100).join(',')).join(' ');
  let dots=values.map((v,i)=>{const[x,y]=point(i,v/100);return`<circle class="radar-dot" cx="${x}" cy="${y}" r="3"/>`}).join('');

  // Labels
  let labels='';
  axes.forEach((lbl,i)=>{
    const[x,y]=point(i,1.18);
    const anchor=parseFloat(x)<cx-10?'end':parseFloat(x)>cx+10?'start':'middle';
    labels+=`<text class="radar-label" x="${x}" y="${y}" text-anchor="${anchor}">${lbl}</text>`;
  });

  return `<svg class="radar-svg" viewBox="0 0 ${size} ${size}">
    ${grid}
    <polygon class="radar-area" points="${dataPts}"/>
    ${dots}${labels}
  </svg>`;
}

// ═══════ OVERVIEW TAB ═══════
function renderOverview(profiles_raw){
  const profiles=profiles_raw.filter(p=>!p.archived);
  const el=document.getElementById('tabOverview');
  const n=profiles.length;
  if(!n){el.innerHTML='<div class="panel" style="text-align:center;padding:40px"><p style="color:var(--tx3)">No training data yet. Profiles will appear here once trainees begin.</p></div>';return}

  const atkD=profiles.filter(p=>p.atk&&p.atk.finished).length;
  const defD=profiles.filter(p=>p.def&&p.def.finished).length;
  const bothD=profiles.filter(p=>p.atk&&p.atk.finished&&p.def&&p.def.finished).length;
  const avgS=Math.round(profiles.reduce((s,p)=>s+score(p),0)/n);
  const risks=profiles.map(p=>calcRisk(p));
  const avgR=Math.round(risks.reduce((a,b)=>a+b,0)/n);
  const crit=risks.filter(r=>r>70).length;
  const high=risks.filter(r=>r>45&&r<=70).length;

  const notStarted=profiles.filter(p=>!p.atk&&!p.def).length;
  const partialOnly=n-bothD-notStarted;
  const lowR=risks.filter(r=>r<=25).length;
  const modR=risks.filter(r=>r>25&&r<=45).length;

  let h=`<div class="chart-row">
    <div class="chart-card">
      <h4>TRAINING COMPLETION ${tip('Shows how many trainees have completed both roles, only one role (partial), or haven\'t started yet.')}</h4>
      ${svgDonut([
        {value:bothD,color:'#00ff41',label:'Both Done'},
        {value:partialOnly,color:'#ff9f0a',label:'Partial'},
        {value:notStarted,color:'#3e4a5c',label:'Not Started'}
      ], bothD+'', 'of '+n+' complete')}
    </div>
    <div class="chart-card">
      <h4>RISK DISTRIBUTION ${tip('Trainees grouped by risk level. Risk score combines: security posture answers (50%), challenge quiz accuracy (30%), and training completion status (20%).')}</h4>
      ${svgDonut([
        {value:lowR,color:'#00ff41',label:'Low'},
        {value:modR,color:'#ff9f0a',label:'Moderate'},
        {value:high,color:'#ff6b35',label:'High'},
        {value:crit,color:'#ff2d55',label:'Critical'}
      ], avgR+'', 'avg risk score')}
    </div>
    <div class="chart-card">
      <h4>ORGANIZATION RISK ${tip('Average risk score across all trainees. LOW (0-25): Good practices. MODERATE (26-45): Some gaps. HIGH (46-70): Significant gaps. CRITICAL (71-100): Urgent attention needed.')}</h4>
      ${svgGauge(avgR, 100, riskLbl(avgR), riskCol(avgR), avgR+'/100')}
      <div style="margin-top:8px">
        <div class="stats" style="margin:0;gap:8px">
          <div class="stat" style="padding:10px"><span class="stat-val" style="font-size:1.4rem;color:var(--blue)">${n}</span><span class="stat-lbl">Trainees</span></div>
          <div class="stat" style="padding:10px"><span class="stat-val" style="font-size:1.4rem;color:var(--amb)">${avgS}</span><span class="stat-lbl">Avg Score</span></div>
        </div>
      </div>
    </div>
  </div>`;

  // Completion bars (keep these for detail)
  const atkPct=n>0?Math.round((atkD/n)*100):0;
  const defPct=n>0?Math.round((defD/n)*100):0;
  const bothPct=n>0?Math.round((bothD/n)*100):0;

  h+=`<div class="panel" style="margin-bottom:16px">
    <h4 style="margin-bottom:14px;font-family:var(--fD);font-size:.8rem;letter-spacing:.08em">COMPLETION RATES</h4>
    <div class="hm-row"><div class="hm-label"><span>Phishing &amp; Deepfakes</span><span style="color:${atkPct>=70?'var(--grn)':atkPct>=40?'var(--amb)':'var(--red)'}">${atkPct}% (${atkD}/${n})</span></div><div class="bar"><div class="bar-fill" style="width:${atkPct}%;background:var(--red)"></div></div></div>
    <div class="hm-row"><div class="hm-label"><span>Security Fundamentals</span><span style="color:${defPct>=70?'var(--grn)':defPct>=40?'var(--amb)':'var(--red)'}">${defPct}% (${defD}/${n})</span></div><div class="bar"><div class="bar-fill" style="width:${defPct}%;background:var(--blue)"></div></div></div>
    <div class="hm-row"><div class="hm-label"><span>Both Completed</span><span style="color:${bothPct>=70?'var(--grn)':bothPct>=40?'var(--amb)':'var(--red)'}">${bothPct}% (${bothD}/${n})</span></div><div class="bar"><div class="bar-fill" style="width:${bothPct}%;background:var(--grn)"></div></div></div>
  </div>`;

  // Property breakdown (if tagged)
  const propCounts={};
  profiles.forEach(p=>{const prop=p.property||'';if(prop)propCounts[prop]=(propCounts[prop]||0)+1});
  const propNames=Object.keys(propCounts);
  if(propNames.length>0){
    h+=`<div class="panel" style="margin-bottom:16px"><h4 style="margin-bottom:10px;font-family:var(--fD);font-size:.8rem;letter-spacing:.08em">PROPERTIES</h4>`;
    propNames.sort().forEach(prop=>{
      const propProfiles=profiles.filter(p=>p.property===prop);
      const propComplete=propProfiles.filter(p=>p.atk&&p.atk.finished&&p.def&&p.def.finished).length;
      const pct=propProfiles.length>0?Math.round((propComplete/propProfiles.length)*100):0;
      h+=`<div class="hm-row"><div class="hm-label"><span>${prop} (${propProfiles.length} staff)</span><span style="color:${pct>=70?'var(--grn)':pct>=40?'var(--amb)':'var(--red)'}; font-family:var(--fM)">${pct}% complete</span></div><div class="bar"><div class="bar-fill" style="width:${pct}%;background:${pct>=70?'var(--grn)':pct>=40?'var(--amb)':'var(--red)'}"></div></div></div>`;
    });
    h+=`</div>`;
  }

  // Flagged
  if(crit>0||high>0){
    const flagged=profiles.map(p=>({name:p.name,risk:calcRisk(p)})).filter(p=>p.risk>45).sort((a,b)=>b.risk-a.risk);
    h+=`<div class="panel panel-r"><h4 style="margin-bottom:10px;font-family:var(--fD);font-size:.8rem;letter-spacing:.08em;color:var(--red)">⚠ FLAGGED INDIVIDUALS (${flagged.length})</h4>`;
    flagged.forEach(f=>{
      h+=`<div class="detail-row"><span>${f.name}</span><span class="risk risk-${riskCls(f.risk)}">${riskLbl(f.risk)} (${f.risk})</span></div>`;
    });
    h+=`</div>`;
  }

  el.innerHTML=h;
}

// ═══════ ROSTER TAB ═══════
function getFilteredProfiles(profiles){
  let filtered=[...profiles];
  if(filterText){
    const q=filterText.toLowerCase();
    filtered=filtered.filter(p=>p.name.toLowerCase().includes(q)||(p.email&&p.email.toLowerCase().includes(q)));
  }
  if(filterProp){
    filtered=filtered.filter(p=>(p.property||'Unassigned')===filterProp);
  }
  if(filterStatus){
    filtered=filtered.filter(p=>{
      const isArchived=p.archived===true;
      if(filterStatus==='archived')return isArchived;
      if(isArchived)return false; // Hide archived from all other filters
      const bothDone=p.atk&&p.atk.finished&&p.def&&p.def.finished;
      const notStarted=!p.atk&&!p.def;
      if(filterStatus==='complete')return bothDone;
      if(filterStatus==='progress')return !bothDone&&!notStarted;
      if(filterStatus==='notstarted')return notStarted;
      if(filterStatus==='highrisk')return calcRisk(p)>45;
      return true;
    });
  } else {
    // By default, hide archived profiles
    filtered=filtered.filter(p=>!p.archived);
  }
  return filtered;
}

function renderRoster(profiles){
  const el=document.getElementById('tabRoster');
  if(!profiles.length){el.innerHTML='<p style="color:var(--tx3);text-align:center;padding:20px">No trainees yet.</p>';return}

  const allProps=[...new Set(profiles.map(p=>p.property||'Unassigned'))].sort();

  let h=`<div class="roster-toolbar">
    <input class="roster-search" type="text" placeholder="Search by name or email..." value="${filterText}" oninput="filterText=this.value;renderRoster(Object.values(DATA))">
    <select class="roster-filter" onchange="filterProp=this.value;renderRoster(Object.values(DATA))">
      <option value="">All Properties</option>
      ${allProps.map(p=>`<option value="${p}"${filterProp===p?' selected':''}>${p}</option>`).join('')}
    </select>
    <select class="roster-filter" onchange="filterStatus=this.value;renderRoster(Object.values(DATA))">
      <option value=""${filterStatus===''?' selected':''}>All Status</option>
      <option value="complete"${filterStatus==='complete'?' selected':''}>Completed</option>
      <option value="progress"${filterStatus==='progress'?' selected':''}>In Progress</option>
      <option value="notstarted"${filterStatus==='notstarted'?' selected':''}>Not Started</option>
      <option value="highrisk"${filterStatus==='highrisk'?' selected':''}>High/Critical Risk</option>
      <option value="archived"${filterStatus==='archived'?' selected':''}>Archived</option>
    </select>
  </div>`;

  const filtered=getFilteredProfiles(profiles);

  if(selectedNames.size>0){
    h+=`<div class="bulk-bar">
      <span class="bulk-count">${selectedNames.size} selected</span>
      <button class="btn bB bSm" onclick="bulkDraftEmail('welcome')">\u{1F4E7} Draft Welcome (${selectedNames.size})</button>
      <button class="btn bB bSm" onclick="bulkDraftEmail('reminder')">\u{1F514} Draft Reminder (${selectedNames.size})</button>
      <button class="btn bR bSm" onclick="bulkDelete()">\u{1F5D1} Delete (${selectedNames.size})</button>
      <button class="btn bSm" style="color:var(--tx3);border-color:var(--tx3)" onclick="selectedNames.clear();renderRoster(Object.values(DATA))">\u2715 Clear</button>
    </div>`;
  }

  const sorted=[...filtered].sort((a,b)=>{
    let av,bv;
    switch(sortCol){
      case 'name':av=a.name.toLowerCase();bv=b.name.toLowerCase();return sortDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
      case 'property':av=(a.property||'zzz').toLowerCase();bv=(b.property||'zzz').toLowerCase();return sortDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
      case 'risk':av=calcRisk(a);bv=calcRisk(b);break;
      case 'atk':av=a.atk?a.atk.score||0:0;bv=b.atk?b.atk.score||0:0;break;
      case 'def':av=a.def?a.def.score||0:0;bv=b.def?b.def.score||0:0;break;
      default:av=score(a);bv=score(b);
    }
    return sortDir==='asc'?av-bv:bv-av;
  });

  const arrow=c=>sortCol===c?(sortDir==='asc'?' \u25B2':' \u25BC'):'';
  const allChecked=sorted.length>0&&sorted.every(p=>selectedNames.has(p.name.toLowerCase()));

  h+=`<p style="font-family:var(--fM);font-size:.68rem;color:var(--tx3);margin-bottom:8px">Showing ${sorted.length} of ${profiles.length} trainees</p>`;
  h+=`<div style="overflow-x:auto"><table class="tbl">
    <thead><tr>
      <th class="chk-col"><input type="checkbox" ${allChecked?'checked':''} onchange="toggleAllChecks(this.checked)" title="Select all"></th>
      <th onclick="doSort('name')" class="${sortCol==='name'?'sorted':''}">Name${arrow('name')}</th>
      <th onclick="doSort('property')" class="${sortCol==='property'?'sorted':''}">Property${arrow('property')}</th>
      <th onclick="doSort('atk')" class="${sortCol==='atk'?'sorted':''}">Phishing &amp; Deepfakes${arrow('atk')}</th>
      <th onclick="doSort('def')" class="${sortCol==='def'?'sorted':''}">Security Fundamentals${arrow('def')}</th>
      <th onclick="doSort('combined')" class="${sortCol==='combined'?'sorted':''}">Combined${arrow('combined')}</th>
      <th onclick="doSort('risk')" class="${sortCol==='risk'?'sorted':''}" title='Risk score: posture 50% + accuracy 30% + completion 20%'>Risk${arrow('risk')}</th>
      <th title='Earned by achieving a perfect score on a module challenge'>Badges</th>
    </tr></thead><tbody>`;

  sorted.forEach(p=>{
    const r=calcRisk(p);
    const badges=getBadges(p);
    const earned=badges.filter(b=>b.earned);
    const atkS=p.atk?(p.atk.finished?`<span style="color:var(--grn)">\u2713 ${p.atk.score}</span>`:`<span style="color:var(--amb)">${p.atk.score} \u25D4</span>`):'<span style="color:var(--tx3)">\u2014</span>';
    const defS=p.def?(p.def.finished?`<span style="color:var(--grn)">\u2713 ${p.def.score}</span>`:`<span style="color:var(--amb)">${p.def.score} \u25D4</span>`):'<span style="color:var(--tx3)">\u2014</span>';
    const key=p.name.replace(/'/g,"\\'");
    const checked=selectedNames.has(p.name.toLowerCase());
    h+=`<tr>
      <td class="chk-col" onclick="event.stopPropagation()"><input type="checkbox" ${checked?'checked':''} onchange="toggleCheck('${key}',this.checked)"></td>
      <td onclick="showDetail('${key}')" style="cursor:pointer"><strong>${p.name}</strong></td>
      <td style="font-size:.78rem;color:var(--tx2)">${p.property||'<span style="color:var(--tx3)">\u2014</span>'}</td>
      <td>${atkS}</td>
      <td>${defS}</td>
      <td style="font-family:var(--fD);color:var(--grn)">${score(p)}</td>
      <td><span class="risk risk-${riskCls(r)}">${riskLbl(r)}</span> <span style="color:var(--tx3);font-size:.7rem">${r}</span></td>
      <td>${earned.map(b=>`<span title="${b.name}">${b.icon}</span>`).join('')||'<span style="color:var(--tx3)">\u2014</span>'}</td>
    </tr>`;
  });
  h+=`</tbody></table></div><div class="detail" id="rosterDetail"></div>`;
  el.innerHTML=h;
  // Restore search focus after re-render
  const searchEl=el.querySelector('.roster-search');
  if(searchEl&&filterText){searchEl.focus();searchEl.setSelectionRange(filterText.length,filterText.length)}
}

function doSort(col){
  if(sortCol===col)sortDir=sortDir==='asc'?'desc':'asc';
  else{sortCol=col;sortDir='desc'}
  renderRoster(Object.values(DATA));
}

function toggleCheck(name,checked){
  const key=name.toLowerCase();
  if(checked)selectedNames.add(key);
  else selectedNames.delete(key);
  renderRoster(Object.values(DATA));
}

function toggleAllChecks(checked){
  const filtered=getFilteredProfiles(Object.values(DATA));
  filtered.forEach(p=>{
    const key=p.name.toLowerCase();
    if(checked)selectedNames.add(key);
    else selectedNames.delete(key);
  });
  renderRoster(Object.values(DATA));
}

function bulkDelete(){
  const count=selectedNames.size;
  if(!confirm('Permanently delete '+count+' selected profile'+(count!==1?'s':'')+'? This cannot be undone.'))return;
  const keys=[...selectedNames];
  Promise.all(keys.map(key=>
    fetch(API+'?action=delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})})
  )).then(()=>{
    keys.forEach(k=>delete DATA[k]);
    selectedNames.clear();
    renderAll();
  }).catch(e=>alert('Some deletions may have failed: '+e.message));
}

function bulkDraftEmail(type){
  const profiles=Object.values(DATA).filter(p=>selectedNames.has(p.name.toLowerCase())&&p.email);
  if(profiles.length===0){alert('None of the selected profiles have email addresses.');return}

  if(type==='welcome'){
    const to=profiles.map(p=>p.email).join(',');
    const subj=encodeURIComponent('Welcome to Cyber Security Training');
    const body=encodeURIComponent('Hello,\n\nYou have been enrolled in our cyber security awareness training program. '
      +'This interactive training covers personal security fundamentals and how to recognize modern phishing and deepfake threats.\n\n'
      +'The training is self-paced and takes approximately 30-45 minutes per path.\n\n'
      +'Access the training here:\n'+TRAINING_URL+'\n\n'
      +'If you have any questions, please contact your administrator.');
    window.open('mailto:'+to+'?subject='+subj+'&body='+body,'_blank');
  } else {
    const incomplete=profiles.filter(p=>!(p.atk&&p.atk.finished&&p.def&&p.def.finished));
    if(incomplete.length===0){alert('All selected profiles have completed training.');return}
    const to=incomplete.map(p=>p.email).join(',');
    const subj=encodeURIComponent('Reminder: Complete Your Cyber Security Training');
    const body=encodeURIComponent('Hello,\n\nThis is a friendly reminder that you have incomplete cyber security awareness training. '
      +'Please log in and complete any remaining modules at your earliest convenience.\n\n'
      +'Access the training here:\n'+TRAINING_URL+'\n\n'
      +'If you have any questions, please contact your administrator.');
    window.open('mailto:'+to+'?subject='+subj+'&body='+body,'_blank');
  }
}

function showDetail(name){
  // Re-fetch latest data from server before rendering
  fetch(API+'?action=getall').then(r=>r.json()).then(d=>{DATA=d;renderDetailInner(name)}).catch(()=>renderDetailInner(name));
}

function renderDetailInner(name){
  const p=Object.values(DATA).find(x=>x.name===name);
  if(!p)return;
  const el=document.getElementById('rosterDetail');
  const r=calcRisk(p);

  const isArchived=p.archived===true;
  let h=`<h3>${p.name} <span class="risk risk-${riskCls(r)}" style="margin-left:8px">${riskLbl(r)} (${r}/100)</span>${isArchived?'<span class="badge bdA" style="margin-left:8px">ARCHIVED</span>':''}</h3>`;
  if(isArchived){
    const safeN=p.name.replace(/'/g,"\\'");
    h+=`<div style="padding:12px;margin-bottom:14px;border:1px solid rgba(255,159,10,.2);border-radius:4px;background:rgba(255,159,10,.04);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span style="font-size:.82rem;color:var(--amb)">This profile was archived${p.archivedDate?' on '+new Date(p.archivedDate).toLocaleDateString():''}. Training data is preserved.</span>
      <button class="btn bG bSm" onclick="restoreProfile('${safeN}')">RESTORE PROFILE</button>
    </div>`;
  }

  // Risk bar
  h+=`<div class="detail-section"><div class="detail-section-title">RISK BREAKDOWN ${tip('Composed of: Security posture (50%) — weighted score from the 6 habit questions. Challenge accuracy (30%) — quiz performance across all modules. Completion (20%) — whether both paths are finished.')}</div>
    <div class="bar" style="margin-bottom:6px"><div class="bar-fill" style="width:${r}%;background:${riskCol(r)}"></div></div>
    <p style="font-size:.78rem;color:var(--tx2)">Security posture 50% · Challenge accuracy 30% · Completion 20%</p></div>`;

  // Posture
  if(p.def&&p.def.dAns&&p.def.dAns.some(a=>a!==null)){
    h+=`<div class="detail-section"><div class="detail-section-title">SECURITY POSTURE ${tip('Self-reported security habits from the Security Fundamentals assessment. Scoring: Best practice = 100% (green ✓), Acceptable = 50% (amber ◐), Risky = 0% (red ⚠).')}</div>`;
    (p.def.dAns||[]).forEach((a,i)=>{
      if(a===null)return;
      const scoreVal=(POSTURE_SCORES[i]&&POSTURE_SCORES[i][a]!==undefined)?POSTURE_SCORES[i][a]:0;
      const col=scoreVal>=100?'var(--grn)':scoreVal>=50?'var(--amb)':'var(--red)';
      const icon=scoreVal>=100?'✓':scoreVal>=50?'◐':'⚠';
      h+=`<div class="detail-row"><span>${POSTURE_QS[i]}</span><span style="color:${col}">${POSTURE_LABELS[a]||a} ${icon}</span></div>`;
    });
    h+=`</div>`;
  }

  // Module question breakdown
  const modNames=MOD_NAMES;
  ['atk','def'].forEach(role=>{
    const session=p[role];
    if(!session)return;
    const label=role==='atk'?'PHISHING &amp; DEEPFAKES':'SECURITY FUNDAMENTALS';
    const doneList=session.done||[];
    const hasModRes=session.modRes&&Object.keys(session.modRes).length>0;
    if(!hasModRes&&doneList.length===0)return;
    h+=`<div class="detail-section"><div class="detail-section-title">${label} MODULE RESULTS — ${session.score||0} pts ${session.finished?'<span style="color:var(--grn)">✓ Complete</span>':'<span style="color:var(--amb)">◔ In Progress</span>'}</div>`;
    for(let m=1;m<=4;m++){
      const res=hasModRes?session.modRes[m]:null;
      const mName=modNames[role]&&modNames[role][m]?modNames[role][m]:'Module '+m;
      const isDone=doneList.includes(m);
      if(!res&&!isDone){
        h+=`<div class="detail-row"><span style="color:var(--tx3)">Module ${m}: ${mName}</span><span style="color:var(--tx3)">Not attempted</span></div>`;
        continue;
      }
      if(!res&&isDone){
        h+=`<div style="margin-bottom:12px;padding:10px;background:rgba(0,255,65,.03);border-left:3px solid var(--grn);border-radius:0 4px 4px 0">`;
        h+=`<div style="display:flex;justify-content:space-between"><span style="font-weight:600">Module ${m}: ${mName}</span><span style="color:var(--grn);font-family:var(--fM);font-size:.8rem">Completed</span></div>`;
        h+=`<div style="font-size:.72rem;color:var(--tx3);margin-top:4px">Detailed question data not available (completed before tracking was enabled)</div>`;
        h+=`</div>`;
        continue;
      }
      const perfect=res.correct===res.total;
      const pct=res.total>0?Math.round((res.correct/res.total)*100):0;
      h+=`<div style="margin-bottom:12px;padding:10px;background:rgba(${perfect?'0,255,65':'255,159,10'},.03);border-left:3px solid ${perfect?'var(--grn)':'var(--amb)'};border-radius:0 4px 4px 0">`;
      h+=`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600">Module ${m}: ${mName}</span><span style="color:${perfect?'var(--grn)':'var(--amb)'};font-family:var(--fM);font-size:.8rem">${res.correct}/${res.total} (${pct}%)</span></div>`;
      // Show individual question results if available
      if(res.questions&&Array.isArray(res.questions)){
        res.questions.forEach((q,qi)=>{
          if(q.question){
            // Quiz question
            h+=`<div class="detail-row" style="padding:4px 0;font-size:.78rem">
              <span style="color:${q.isCorrect?'var(--grn)':'var(--red)'}">Q${qi+1}: ${q.isCorrect?'✓':'✗'}</span>
              <span style="color:var(--tx2);flex:1;margin:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${q.question||q.subject||''}</span>
              ${!q.isCorrect&&q.answer?'<span style="color:var(--tx3);font-size:.7rem">Correct: '+q.answer+'</span>':''}
            </div>`;
          } else if(q.subject){
            // Phishing question
            h+=`<div class="detail-row" style="padding:4px 0;font-size:.78rem">
              <span style="color:${q.isCorrect?'var(--grn)':'var(--red)'}">Q${qi+1}: ${q.isCorrect?'✓':'✗'}</span>
              <span style="color:var(--tx2);flex:1;margin:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${q.subject}</span>
              <span style="color:var(--tx3);font-size:.7rem">${q.answer==='phish'?'Phishing':'Legit'}</span>
            </div>`;
          } else if(q.type==='wifi'){
            h+=`<div class="detail-row" style="padding:4px 0;font-size:.78rem"><span style="color:var(--tx2)">WiFi challenge: identified ${q.identified}/${q.rogueTotal} rogues</span></div>`;
          } else if(q.type==='pwlab'){
            const pwCol=q.strengthScore>=80?'var(--grn)':q.strengthScore>=65?'#7ae582':q.strengthScore>=45?'var(--amb)':q.strengthScore>=25?'#ff6b35':'var(--red)';
            h+=`<div style="padding:8px 0;font-size:.78rem">
              <div class="detail-row" style="border:none;padding:2px 0"><span>Password Strength</span><span style="color:${pwCol};font-weight:700">${q.strengthLabel||'Unknown'} (${q.strengthScore||0}/100)</span></div>
              <div class="bar" style="margin:4px 0 6px"><div class="bar-fill" style="width:${q.strengthScore||0}%;background:${pwCol}"></div></div>
              <div style="display:flex;gap:12px;flex-wrap:wrap;color:var(--tx3);font-family:var(--fM);font-size:.7rem">
                <span>Length: ${q.length||'?'}</span>
                <span style="color:${q.hasUpper?'var(--grn)':'var(--red)'}">Upper ${q.hasUpper?'✓':'✗'}</span>
                <span style="color:${q.hasLower?'var(--grn)':'var(--red)'}">Lower ${q.hasLower?'✓':'✗'}</span>
                <span style="color:${q.hasNumbers?'var(--grn)':'var(--red)'}">Numbers ${q.hasNumbers?'✓':'✗'}</span>
                <span style="color:${q.hasSpecial?'var(--grn)':'var(--red)'}">Special ${q.hasSpecial?'✓':'✗'}</span>
                <span>Crack time: ${q.crackTime||'N/A'}</span>
              </div>
            </div>`;
          }
        });
      }
      h+=`</div>`;
    }
    h+=`</div>`;

    // Module retake history
    if(session.modHistory&&session.modHistory.length>0){
      h+=`<div class="detail-section"><div class="detail-section-title">${label} RETAKE HISTORY</div>`;
      const grouped={};
      session.modHistory.forEach(entry=>{
        if(!grouped[entry.mod])grouped[entry.mod]=[];
        grouped[entry.mod].push(entry);
      });
      Object.entries(grouped).forEach(([mod,entries])=>{
        const mName=modNames[role]&&modNames[role][mod]?modNames[role][mod]:'Module '+mod;
        h+=`<div style="margin-bottom:10px;padding:10px;background:rgba(0,212,255,.02);border-left:2px solid var(--blue);border-radius:0 4px 4px 0">
          <div style="font-family:var(--fD);font-size:.7rem;color:var(--tx2);margin-bottom:6px">Module ${mod}: ${mName} — ${entries.length} previous attempt${entries.length!==1?'s':''}</div>`;
        entries.forEach((entry,ei)=>{
          const date=new Date(entry.date).toLocaleDateString();
          const res=entry.result;
          if(!res)return;
          // Check for password strength data
          if(res.questions&&res.questions[0]&&res.questions[0].type==='pwlab'){
            const pw=res.questions[0];
            const pwCol=pw.strengthScore>=80?'var(--grn)':pw.strengthScore>=65?'#7ae582':pw.strengthScore>=45?'var(--amb)':pw.strengthScore>=25?'#ff6b35':'var(--red)';
            h+=`<div class="detail-row" style="padding:4px 0;font-size:.78rem">
              <span style="color:var(--tx3)">${date}</span>
              <span>Password: <span style="color:${pwCol};font-weight:600">${pw.strengthLabel||'Unknown'} (${pw.strengthScore||0}/100)</span> · Length: ${pw.length||'?'} · Crack: ${pw.crackTime||'N/A'}</span>
            </div>`;
          } else {
            const pct=res.total>0?Math.round((res.correct/res.total)*100):0;
            h+=`<div class="detail-row" style="padding:4px 0;font-size:.78rem">
              <span style="color:var(--tx3)">${date}</span>
              <span style="color:${pct>=70?'var(--grn)':pct>=50?'var(--amb)':'var(--red)'}">${res.correct}/${res.total} (${pct}%)</span>
            </div>`;
          }
        });
        // Show current vs previous comparison for password labs
        const currentRes=session.modRes&&session.modRes[mod];
        if(currentRes&&currentRes.questions&&currentRes.questions[0]&&currentRes.questions[0].type==='pwlab'&&entries.length>0){
          const lastEntry=entries[entries.length-1];
          if(lastEntry.result&&lastEntry.result.questions&&lastEntry.result.questions[0]){
            const prev=lastEntry.result.questions[0];
            const curr=currentRes.questions[0];
            const delta=(curr.strengthScore||0)-(prev.strengthScore||0);
            if(delta!==0){
              h+=`<div style="padding:4px 0;font-size:.72rem;color:${delta>0?'var(--grn)':'var(--red)'}">
                ${delta>0?'▲':'▼'} Password strength ${delta>0?'improved':'declined'} by ${Math.abs(delta)} points since last attempt
              </div>`;
            }
          }
        }
        h+=`</div>`;
      });
      h+=`</div>`;
    }
  });

  // Editable profile fields
  const safeName=p.name.replace(/'/g,"\\'");
  h+=`<div class="detail-section"><div class="detail-section-title">PROFILE DETAILS</div>
    <div class="edit-field"><label>Name</label><input type="text" id="editName" value="${p.name}"></div>
    <div class="edit-field"><label>Property</label><input type="text" id="editProp" value="${p.property||''}" placeholder="e.g., Property A"></div>
    <div class="edit-field"><label>Email</label><input type="text" id="editEmail" value="${p.email||''}" placeholder="email@company.com"></div>
    <div class="edit-field"><label>Due By</label><input type="date" id="editDue" value="${p.dueBy||''}"></div>
  </div>`;

  h+=`<div class="edit-actions">
    <button class="btn bG bSm" onclick="saveProfileEdits('${safeName}')">SAVE CHANGES</button>
    <button class="btn bB bSm" onclick="sendWelcomeEmail('${safeName}')" ${p.email?'':'disabled title="No email address on file"'}>📧 DRAFT WELCOME EMAIL</button>
    <button class="btn bB bSm" onclick="sendReminderEmail('${safeName}')" ${p.email?'':'disabled title="No email address on file"'}>🔔 DRAFT REMINDER</button>
    ${!isArchived?`<button class="btn bSm" style="color:var(--amb);border-color:var(--amb)" onclick="if(confirm('Archive ${p.name}\\'s profile? Their data will be preserved but they will be unable to access training.'))archiveProfile('${safeName}')">📦 ARCHIVE</button>`:''}
    <button class="btn bR bSm" onclick="if(confirm('Permanently delete ${p.name}\\'s profile? This cannot be undone.'))deleteProfile('${safeName}')" style="margin-left:auto">DELETE PROFILE</button>
  </div>`;
  h+=`<div id="editResult" style="font-family:var(--fM);font-size:.78rem;margin-top:8px"></div>`;

  el.innerHTML=h;
  el.classList.add('open');
  el.scrollIntoView({behavior:'smooth'});
}

function archiveProfile(name){
  const key=name.toLowerCase();
  fetch(API+'?action=archive',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key})
  }).then(r=>r.json()).then(result=>{
    if(result.success){
      if(DATA[key]){
        DATA[key].archived=true;
        DATA[key].archivedDate=new Date().toISOString();
      }
      document.getElementById('rosterDetail').classList.remove('open');
      renderAll();
    }
  });
}

function restoreProfile(name){
  const key=name.toLowerCase();
  fetch(API+'?action=unarchive',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key})
  }).then(r=>r.json()).then(result=>{
    if(result.success){
      // Update local data
      if(DATA[key]){
        delete DATA[key].archived;
        delete DATA[key].archivedDate;
      }
      document.getElementById('rosterDetail').classList.remove('open');
      renderAll();
    }
  });
}

function saveProfileEdits(originalName){
  const key=originalName.toLowerCase();
  const newName=document.getElementById('editName').value.trim();
  const prop=document.getElementById('editProp').value.trim();
  const email=document.getElementById('editEmail').value.trim();
  const due=document.getElementById('editDue').value;
  const res=document.getElementById('editResult');

  if(!newName){res.innerHTML='<span style="color:var(--red)">Name cannot be empty.</span>';return}

  // Build the updated profile by merging with existing data
  const existing=DATA[key];
  if(!existing){res.innerHTML='<span style="color:var(--red)">Profile not found.</span>';return}

  existing.name=newName;
  existing.property=prop;
  existing.email=email;
  existing.dueBy=due;

  // If name changed, need to delete old key and create new
  const newKey=newName.toLowerCase();
  if(newKey!==key){
    // Delete old
    fetch(API+'?action=delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})}).catch(()=>{});
    delete DATA[key];
  }
  DATA[newKey]=existing;

  // Save to server
  fetch(API+'?action=save',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key:newKey,profile:existing})
  })
  .then(r=>r.json())
  .then(result=>{
    if(result.success){
      res.innerHTML='<span style="color:var(--grn)">✓ Profile updated.</span>';
      setTimeout(()=>{renderAll()},800);
    } else {
      res.innerHTML='<span style="color:var(--red)">Save failed: '+(result.error||'Unknown')+'</span>';
    }
  })
  .catch(e=>res.innerHTML='<span style="color:var(--red)">Network error: '+e.message+'</span>');
}

function sendWelcomeEmail(name){
  const p=Object.values(DATA).find(x=>x.name===name);
  if(!p||!p.email){alert('No email address on file.');return}
  const due=p.dueBy?'\n\nPlease complete by: '+p.dueBy:'';
  const subj=encodeURIComponent('Welcome to Cyber Security Training');
  const body=encodeURIComponent('Hi '+p.name+',\n\n'
    +'You have been enrolled in our cyber security awareness training program. '
    +'This interactive training covers personal security fundamentals and how to recognize modern phishing and deepfake threats.\n\n'
    +'The training is self-paced and takes approximately 30-45 minutes per path.'
    +due+'\n\n'
    +'Access the training here:\n'
    +TRAINING_URL+'\n\n'
    +'If you have any questions, please contact your administrator.');
  window.open('mailto:'+p.email+'?subject='+subj+'&body='+body,'_blank');
}

function sendReminderEmail(name){
  const p=Object.values(DATA).find(x=>x.name===name);
  if(!p||!p.email){alert('No email address on file.');return}
  const atkDone=p.atk&&p.atk.finished;
  const defDone=p.def&&p.def.finished;
  if(atkDone&&defDone){alert(name+' has already completed both paths.');return}

  const incomplete=[];
  if(!atkDone)incomplete.push('Phishing & Deepfakes');
  if(!defDone)incomplete.push('Security Fundamentals');
  const missing=incomplete.join(' and ');

  let dueNote='';
  if(p.dueBy){
    const daysLeft=Math.ceil((new Date(p.dueBy)-new Date())/(1000*60*60*24));
    if(daysLeft<0)dueNote='\n\nIMPORTANT: Your training deadline was '+p.dueBy+'. Please complete it as soon as possible.';
    else if(daysLeft<=7)dueNote='\n\nYour training is due by '+p.dueBy+' ('+daysLeft+' day'+(daysLeft!==1?'s':'')+' remaining).';
    else dueNote='\n\nTraining due by: '+p.dueBy;
  }

  const subj=encodeURIComponent('Reminder: Complete Your Cyber Security Training');
  const body=encodeURIComponent('Hi '+p.name+',\n\n'
    +'This is a friendly reminder that you have incomplete cyber security awareness training. '
    +'You still need to complete: '+missing+'.'
    +dueNote+'\n\n'
    +'The training takes approximately 30 minutes per path and can be completed at your own pace.\n\n'
    +'Access the training here:\n'
    +TRAINING_URL+'\n\n'
    +'If you have any questions, please contact your administrator.');
  window.open('mailto:'+p.email+'?subject='+subj+'&body='+body,'_blank');
}

function deleteProfile(name){
  const key=name.toLowerCase();
  fetch(API+'?action=delete',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key})
  })
  .then(r=>r.json())
  .then(result=>{
    if(result.success){
      delete DATA[key];
      document.getElementById('rosterDetail').classList.remove('open');
      renderAll();
    } else {
      alert('Delete failed: '+(result.error||'Unknown error'));
    }
  })
  .catch(err=>{
    alert('Delete failed: '+err.message);
  });
}

// ═══════ NEEDS ATTENTION TAB ═══════
function renderNeedsAttention(profiles_raw){
  const profiles=profiles_raw.filter(p=>!p.archived);
  const el=document.getElementById('tabNeeds');
  if(!profiles.length){el.innerHTML='<div class="panel" style="text-align:center;padding:30px"><p style="color:var(--tx3)">No trainees yet.</p></div>';return}

  // Categorize issues
  const noTraining=profiles.filter(p=>!p.atk&&!p.def);
  const partialOnly=profiles.filter(p=>(p.atk||p.def)&&!(p.atk&&p.atk.finished&&p.def&&p.def.finished));
  const highRisk=profiles.filter(p=>calcRisk(p)>45);
  const lowScorers=profiles.filter(p=>{
    let tq=0,tc=0;
    ['atk','def'].forEach(r=>{if(p[r]&&p[r].modRes){for(let m=1;m<=4;m++){const res=p[r].modRes[m];if(res){tc+=res.correct;tq+=res.total}}}});
    return tq>0&&(tc/tq)<0.5;
  });

  const totalIssues=new Set([...noTraining,...partialOnly,...highRisk,...lowScorers].map(p=>p.name)).size;

  let h=`<div class="panel" style="text-align:center;margin-bottom:16px">
    <span class="stat-val" style="color:${totalIssues===0?'var(--grn)':'var(--amb)'}">${totalIssues}</span>
    <span class="stat-lbl">TRAINEES NEEDING ATTENTION ${tip('Count of unique trainees who fall into at least one attention category: not started, incomplete, high/critical risk, or low quiz scores (below 50%).')}</span>
  </div>`;

  if(noTraining.length>0){
    h+=`<div class="panel panel-r" style="margin-bottom:16px"><h4 style="margin-bottom:10px;font-family:var(--fD);font-size:.8rem;color:var(--red)">🚫 NOT STARTED (${noTraining.length})</h4>
    <p style="font-size:.82rem;color:var(--tx2);margin-bottom:10px">These trainees have a profile but haven't begun either training path.</p>`;
    noTraining.forEach(p=>{h+=`<div class="detail-row"><span>${p.name}</span><span class="attn-tag attn-incomplete">NO TRAINING</span></div>`});
    h+=`</div>`;
  }

  if(partialOnly.length>0){
    h+=`<div class="panel" style="border-color:rgba(255,159,10,.15);margin-bottom:16px"><h4 style="margin-bottom:10px;font-family:var(--fD);font-size:.8rem;color:var(--amb)">⏳ INCOMPLETE (${partialOnly.length})</h4>
    <p style="font-size:.82rem;color:var(--tx2);margin-bottom:10px">Started but haven't completed both Security Fundamentals and Phishing &amp; Deepfakes.</p>`;
    partialOnly.forEach(p=>{
      const atkS=p.atk?(p.atk.finished?'S2 ✓':'S2 ◔'):'S2 ✗';
      const defS=p.def?(p.def.finished?'S1 ✓':'S1 ◔'):'S1 ✗';
      const atkCol=p.atk?(p.atk.finished?'var(--grn)':'var(--amb)'):'var(--tx3)';
      const defCol=p.def?(p.def.finished?'var(--grn)':'var(--amb)'):'var(--tx3)';
      h+=`<div class="detail-row"><span>${p.name}</span><span><span style="color:${atkCol};font-family:var(--fM);font-size:.7rem">${atkS}</span> <span style="color:${defCol};font-family:var(--fM);font-size:.7rem">${defS}</span></span></div>`;
    });
    h+=`</div>`;
  }

  if(highRisk.length>0){
    h+=`<div class="panel panel-r" style="margin-bottom:16px"><h4 style="margin-bottom:10px;font-family:var(--fD);font-size:.8rem;color:var(--red)">⚠ HIGH/CRITICAL RISK (${highRisk.length})</h4>
    <p style="font-size:.82rem;color:var(--tx2);margin-bottom:10px">Risk score above 45 — may need additional support or follow-up.</p>`;
    highRisk.sort((a,b)=>calcRisk(b)-calcRisk(a)).forEach(p=>{
      const r=calcRisk(p);
      h+=`<div class="detail-row"><span>${p.name}</span><span class="risk risk-${riskCls(r)}">${riskLbl(r)} (${r})</span></div>`;
    });
    h+=`</div>`;
  }

  if(lowScorers.length>0){
    h+=`<div class="panel" style="border-color:rgba(255,159,10,.15);margin-bottom:16px"><h4 style="margin-bottom:10px;font-family:var(--fD);font-size:.8rem;color:var(--amb)">📉 LOW QUIZ SCORES (${lowScorers.length})</h4>
    <p style="font-size:.82rem;color:var(--tx2);margin-bottom:10px">Below 50% accuracy on module challenges — knowledge gaps detected.</p>`;
    lowScorers.forEach(p=>{
      let tq=0,tc=0;
      ['atk','def'].forEach(r=>{if(p[r]&&p[r].modRes){for(let m=1;m<=4;m++){const res=p[r].modRes[m];if(res){tc+=res.correct;tq+=res.total}}}});
      const pct=tq>0?Math.round((tc/tq)*100):0;
      h+=`<div class="detail-row"><span>${p.name}</span><span style="color:var(--amb);font-family:var(--fM);font-size:.8rem">${tc}/${tq} (${pct}%)</span></div>`;
    });
    h+=`</div>`;
  }

  if(totalIssues===0){
    h+=`<div class="panel" style="border-color:rgba(0,255,65,.15);text-align:center;padding:30px"><h4 style="color:var(--grn)">✓ All trainees are in good standing.</h4><p style="color:var(--tx2);font-size:.85rem;margin-top:6px">No incomplete training, no high-risk scores, no knowledge gaps detected.</p></div>`;
  }

  el.innerHTML=h;
}

// ═══════ MODULE DIFFICULTY ANALYSIS TAB ═══════
function renderDifficulty(profiles_raw){
  const profiles=profiles_raw.filter(p=>!p.archived);
  const el=document.getElementById('tabDifficulty');
  if(!profiles.length){el.innerHTML='<div class="panel" style="text-align:center;padding:30px"><p style="color:var(--tx3)">No data yet.</p></div>';return}

  // Build radar overview of module performance
  const modLabels=[];const modScores=[];
  ['def','atk'].forEach(role=>{
    for(let m=1;m<=4;m++){
      const mName=(MOD_NAMES[role][m]||'Module '+m).split('&')[0].trim();
      const short=mName.length>18?mName.slice(0,16)+'..':mName;
      let tc=0,tq=0,pwScores=[];
      profiles.forEach(p=>{
        const s=p[role];if(!s||!s.modRes||!s.modRes[m])return;
        const r=s.modRes[m];
        if(r.questions){r.questions.forEach(q=>{
          if(q.type==='pwlab'){pwScores.push(q.strengthScore||0)}
          else{tq++;if(q.isCorrect)tc++}
        })}
        else if(r.total){tq+=r.total;tc+=r.correct}
      });
      modLabels.push(short);
      if(pwScores.length>0){
        // Password lab — use average strength score
        modScores.push(Math.round(pwScores.reduce((a,b)=>a+b,0)/pwScores.length));
      } else {
        modScores.push(tq>0?Math.round((tc/tq)*100):0);
      }
    }
  });

  let h=`<div class="chart-row" style="margin-bottom:20px">
    <div class="chart-card" style="flex:2;min-width:320px">
      <h4>MODULE PERFORMANCE OVERVIEW ${tip('Radar chart of quiz accuracy per module. Password Strength Lab uses the strength score (0-100) instead of accuracy. Points near the edge = high performance.')}</h4>
      ${svgRadar(modLabels, modScores, 280)}
      <p style="font-family:var(--fM);font-size:.6rem;color:var(--tx3);margin-top:8px">% accuracy per module (outer = better)</p>
    </div>
  </div>`;

  h+=`<p style="font-size:.88rem;color:var(--tx2);margin-bottom:20px">Aggregate accuracy per question across all trainees. Low-scoring questions indicate either knowledge gaps or unclear question wording.</p>`;

  ['def','atk'].forEach(role=>{
    const roleLabel=role==='def'?'SECURITY FUNDAMENTALS':'PHISHING &amp; DEEPFAKES';
    const names=MOD_NAMES[role];
    h+=`<h3 style="font-family:var(--fD);font-size:.85rem;letter-spacing:.1em;margin-bottom:14px;color:${role==='def'?'var(--blue)':'var(--red)'}">${roleLabel} PATH</h3>`;

    for(let m=1;m<=4;m++){
      const mName=names[m]||'Module '+m;
      // Collect all question-level data for this module
      const questionData={};
      let totalAttempts=0;

      profiles.forEach(p=>{
        const session=p[role];
        if(!session||!session.modRes||!session.modRes[m])return;
        const res=session.modRes[m];
        if(!res.questions||!Array.isArray(res.questions))return;
        totalAttempts++;
        res.questions.forEach((q,qi)=>{
          if(q.type==='pwlab'){
            // Password lab — track strength scores separately
            if(!questionData['pwlab'])questionData['pwlab']={type:'pwlab',text:'Password Strength Lab',scores:[],total:0};
            questionData['pwlab'].total++;
            questionData['pwlab'].scores.push(q.strengthScore||0);
          } else {
            if(!questionData[qi])questionData[qi]={text:q.question||q.subject||'Question '+(qi+1),correct:0,total:0,answer:q.answer||''};
            questionData[qi].total++;
            if(q.isCorrect)questionData[qi].correct++;
          }
        });
      });

      if(totalAttempts===0){
        h+=`<div class="panel" style="margin-bottom:16px;padding:16px"><span style="font-weight:600">Module ${m}: ${mName}</span><span style="color:var(--tx3);font-size:.82rem;margin-left:10px">No detailed data available</span></div>`;
        continue;
      }

      // Module-level accuracy (exclude pwlab from accuracy calc)
      let modCorrect=0,modTotal=0;
      Object.entries(questionData).forEach(([k,q])=>{
        if(q.type==='pwlab')return;
        modCorrect+=q.correct;modTotal+=q.total;
      });
      const hasPwLab=!!questionData['pwlab'];
      const pwLabData=questionData['pwlab'];
      const avgPwScore=hasPwLab&&pwLabData.scores.length>0?Math.round(pwLabData.scores.reduce((a,b)=>a+b,0)/pwLabData.scores.length):0;
      const pwCol=avgPwScore>=80?'var(--grn)':avgPwScore>=65?'#7ae582':avgPwScore>=45?'var(--amb)':avgPwScore>=25?'#ff6b35':'var(--red)';
      const pwLabel=avgPwScore>=80?'VERY STRONG':avgPwScore>=65?'STRONG':avgPwScore>=45?'MODERATE':avgPwScore>=25?'WEAK':'CRITICALLY WEAK';

      // Header: show accuracy for quiz modules, strength for pwlab modules
      let modHeader,modBarPct,modBarCol;
      if(modTotal>0){
        const modPct=Math.round((modCorrect/modTotal)*100);
        modBarPct=modPct;modBarCol=modPct>=70?'var(--grn)':modPct>=50?'var(--amb)':'var(--red)';
        modHeader=`${modPct}% avg accuracy`;
      } else if(hasPwLab){
        modBarPct=avgPwScore;modBarCol=pwCol;
        modHeader=`Avg strength: ${pwLabel}`;
      } else {
        modBarPct=0;modBarCol='var(--tx3)';modHeader='No data';
      }

      h+=`<div class="panel mod-collapse" style="margin-bottom:16px" onclick="this.classList.toggle('open')">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600"><span class="mod-collapse-arrow">▶</span>Module ${m}: ${mName}</span>
          <span style="font-family:var(--fD);color:${modBarCol};font-size:.85rem">${modHeader}</span>
        </div>
        <div class="bar" style="margin-top:8px"><div class="bar-fill" style="width:${modBarPct}%;background:${modBarCol}"></div></div>
        <div class="mod-collapse-body">
        <div style="font-family:var(--fM);font-size:.65rem;color:var(--tx3);margin:10px 0 10px">${totalAttempts} trainee${totalAttempts!==1?'s':''} attempted</div>`;

      // Per-question breakdown
      const questions=Object.entries(questionData).sort((a,b)=>{
        if(a[1].type==='pwlab')return 1; // pwlab goes last
        if(b[1].type==='pwlab')return -1;
        const aPct=a[1].total>0?a[1].correct/a[1].total:0;
        const bPct=b[1].total>0?b[1].correct/b[1].total:0;
        return aPct-bPct; // Worst first
      });

      questions.forEach(([qi,q])=>{
        if(q.type==='pwlab'){
          // Password lab — show aggregate strength
          h+=`<div class="qdiff" style="border-left-color:${pwCol.replace('var(--','rgba(').replace(')',',0.3)')};border-left-color:${avgPwScore>=65?'rgba(0,255,65,.3)':avgPwScore>=45?'rgba(255,159,10,.3)':'rgba(255,45,85,.3)'}">
            <div class="qdiff-head">
              <span class="qdiff-q">Password Strength Lab</span>
              <span class="qdiff-pct" style="color:${pwCol}">${avgPwScore}/100</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${avgPwScore}%;background:${pwCol}"></div></div>
            <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:.72rem;color:var(--tx3)">
              <span>Avg across ${q.scores.length} trainee${q.scores.length!==1?'s':''}: ${pwLabel}</span>
              ${avgPwScore<45?'<span style="color:var(--red)">⚠ Weak passwords in use</span>':''}
            </div>
          </div>`;
          return;
        }
        const pct=q.total>0?Math.round((q.correct/q.total)*100):0;
        const col=pct>=70?'var(--grn)':pct>=50?'var(--amb)':'var(--red)';
        const borderCol=pct>=70?'rgba(0,255,65,.3)':pct>=50?'rgba(255,159,10,.3)':'rgba(255,45,85,.3)';
        h+=`<div class="qdiff" style="border-left-color:${borderCol}">
          <div class="qdiff-head">
            <span class="qdiff-q">${q.text}</span>
            <span class="qdiff-pct" style="color:${col}">${pct}%</span>
          </div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
          <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:.72rem;color:var(--tx3)">
            <span>${q.correct}/${q.total} correct</span>
            ${pct<50?'<span style="color:var(--red)">⚠ Knowledge gap detected</span>':''}
          </div>
        </div>`;
      });

      h+=`</div></div>`;
    }
  });

  // Security Posture Heatmap (weighted scoring)
  const postureAgg=calcPostureAgg(profiles);
  const postureValues=postureAgg.map(p=>p.pct);
  const shortLabels=['Passwords','MFA','Pw Manager','Links','AI Data','Social'];

  h+=`<h3 style="font-family:var(--fD);font-size:.85rem;letter-spacing:.1em;margin:24px 0 14px;color:var(--grn)">SECURITY POSTURE</h3>`;
  h+=`<div class="chart-row" style="margin-bottom:16px">
    <div class="chart-card">
      <h4>POSTURE RADAR ${tip('Spider chart of aggregate security posture. Each axis shows the weighted average across all trainees. Points near the edge = strong practices. Points near center = weak.')}</h4>
      ${svgRadar(shortLabels, postureValues)}
