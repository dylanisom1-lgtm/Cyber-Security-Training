// ═══════ PRINTABLE SUMMARY REPORT ═══════
function renderPrintReport(profiles){
  const el=document.getElementById('tabPrint');
  const n=profiles.length;
  if(!n){el.innerHTML='<div class="panel" style="text-align:center;padding:30px"><p style="color:var(--tx3)">No data to report.</p></div>';return}

  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const atkD=profiles.filter(p=>p.atk&&p.atk.finished).length;
  const defD=profiles.filter(p=>p.def&&p.def.finished).length;
  const bothD=profiles.filter(p=>p.atk&&p.atk.finished&&p.def&&p.def.finished).length;
  const risks=profiles.map(p=>({name:p.name,score:calcRisk(p)}));
  const avgR=Math.round(risks.reduce((s,r)=>s+r.score,0)/n);
  const crit=risks.filter(r=>r.score>70).length;
  const high=risks.filter(r=>r.score>45&&r.score<=70).length;
  const atkPct=Math.round((atkD/n)*100);
  const defPct=Math.round((defD/n)*100);
  const bothPct=Math.round((bothD/n)*100);

  // Posture aggregation (weighted)
  const postureAgg=calcPostureAgg(profiles);

  // Top 3 weakest questions
  const weakQs=[];
  ['def','atk'].forEach(role=>{
    for(let m=1;m<=4;m++){
      const qData={};let attempts=0;
      profiles.forEach(p=>{
        const s=p[role];if(!s||!s.modRes||!s.modRes[m]||!s.modRes[m].questions)return;
        attempts++;
        s.modRes[m].questions.forEach((q,qi)=>{
          if(q.type==='pwlab')return; // Password lab is not a right/wrong question
          const key=role+'-'+m+'-'+qi;
          if(!qData[key])qData[key]={text:q.question||q.subject||'Q'+(qi+1),correct:0,total:0,mod:MOD_NAMES[role][m],role};
          qData[key].total++;if(q.isCorrect)qData[key].correct++;
        });
      });
      Object.values(qData).forEach(q=>{if(q.total>=2)weakQs.push({...q,pct:Math.round((q.correct/q.total)*100)})});
    }
  });
  weakQs.sort((a,b)=>a.pct-b.pct);

  const rCol=s=>s<=25?'p-risk-low':s<=45?'p-risk-mod':s<=70?'p-risk-high':'p-risk-crit';

  let h=`<div class="print-btn-bar">
    <button class="btn bB bSm" onclick="window.print()">🖨 PRINT REPORT</button>
    <button class="btn bG bSm" onclick="exportComplianceCSV()">📋 EXPORT COMPLIANCE CSV</button>
  </div>`;

  h+=`<div class="print-frame">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
      <div><h1 style="font-family:var(--fD)">CYBER SECURITY TRAINING</h1><p style="font-size:.85rem;color:#666">Summary Report — ${date}</p></div>
      <div style="text-align:right;font-size:.75rem;color:#999">CONFIDENTIAL<br>For internal use only</div>
    </div>

    <div class="p-stats">
      <div class="p-stat"><span class="p-stat-val" style="color:#2563eb">${n}</span><span class="p-stat-lbl">Total Trainees</span></div>
      <div class="p-stat"><span class="p-stat-val" style="color:#16a34a">${bothD}</span><span class="p-stat-lbl">Both Complete</span></div>
      <div class="p-stat"><span class="p-stat-val ${rCol(avgR)}">${avgR}/100</span><span class="p-stat-lbl">Avg Risk Score</span></div>
      <div class="p-stat"><span class="p-stat-val" style="color:#dc2626">${crit+high}</span><span class="p-stat-lbl">High/Critical</span></div>
    </div>

    <h2>Completion Rates</h2>
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-size:.82rem"><span>Phishing &amp; Deepfakes</span><span>${atkPct}% (${atkD}/${n})</span></div>
      <div class="p-bar"><div class="p-bar-fill" style="width:${atkPct}%;background:#dc2626"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-top:8px"><span>Security Fundamentals</span><span>${defPct}% (${defD}/${n})</span></div>
      <div class="p-bar"><div class="p-bar-fill" style="width:${defPct}%;background:#2563eb"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-top:8px"><span>Both Completed</span><span>${bothPct}% (${bothD}/${n})</span></div>
      <div class="p-bar"><div class="p-bar-fill" style="width:${bothPct}%;background:#16a34a"></div></div>
    </div>

    <h2>Security Posture (Security Fundamentals Assessment)</h2>
    <table><thead><tr><th>Category</th><th>Compliance Rate</th><th>Status</th></tr></thead><tbody>`;

  postureAgg.forEach(p=>{
    const status=p.count===0?'No data':p.pct>=70?'Good':p.pct>=40?'Needs Improvement':'Critical Gap';
    const col=p.count===0?'#999':p.pct>=70?'#16a34a':p.pct>=40?'#d97706':'#dc2626';
    h+=`<tr><td>${p.question}</td><td>${p.count>0?p.pct+'%':'—'}</td><td><span class="p-vuln" style="color:${col};background:${col}15">${status}</span></td></tr>`;
  });
  h+=`</tbody></table>`;

  if(weakQs.length>0){
    h+=`<h2>Top Knowledge Gaps</h2><table><thead><tr><th>Question</th><th>Module</th><th>Accuracy</th></tr></thead><tbody>`;
    weakQs.slice(0,5).forEach(q=>{
      const col=q.pct>=50?'#d97706':'#dc2626';
      h+=`<tr><td style="max-width:300px">${q.text}</td><td style="font-size:.75rem">${q.mod}</td><td style="color:${col};font-weight:700">${q.pct}%</td></tr>`;
    });
    h+=`</tbody></table>`;
  }

  if(crit+high>0){
    h+=`<h2>Flagged Individuals</h2><table><thead><tr><th>Name</th><th>Risk Score</th><th>Level</th></tr></thead><tbody>`;
    risks.filter(r=>r.score>45).sort((a,b)=>b.score-a.score).forEach(r=>{
      h+=`<tr><td>${r.name}</td><td>${r.score}/100</td><td><span class="p-vuln ${rCol(r.score)}">${riskLbl(r.score)}</span></td></tr>`;
    });
    h+=`</tbody></table>`;
  }

  h+=`<h2>Full Roster</h2><table><thead><tr><th>Name</th><th>Property</th><th>Phishing &amp; Deepfakes</th><th>Security Fundamentals</th><th>Score</th><th>Risk</th></tr></thead><tbody>`;
  profiles.sort((a,b)=>score(b)-score(a)).forEach(p=>{
    const r=calcRisk(p);
    h+=`<tr>
      <td>${p.name}</td>
      <td style="font-size:.75rem">${p.property||"—"}</td>
      <td>${p.atk?(p.atk.finished?'✓ Complete':'In Progress'):'—'}</td>
      <td>${p.def?(p.def.finished?'✓ Complete':'In Progress'):'—'}</td>
      <td>${score(p)}</td>
      <td><span class="p-vuln ${rCol(r)}">${riskLbl(r)}</span></td>
    </tr>`;
  });
  h+=`</tbody></table>`;

  h+=`<div style="margin-top:24px;padding-top:12px;border-top:1px solid #ddd;font-size:.7rem;color:#999;display:flex;justify-content:space-between">
    <span>Generated: ${new Date().toLocaleString()}</span>
    <span>Cyber Security Awareness Training v2.0</span>
  </div></div>`;

  el.innerHTML=h;
}

function exportComplianceCSV(){
  const profiles=Object.values(DATA);

  let csv='Name,Phishing & Deepfakes Status,Phishing & Deepfakes Score,Security Fundamentals Status,Security Fundamentals Score,Combined Score,Risk Score,Risk Level,Password Reuse,MFA,Password Manager,Link Handling,AI Data Hygiene,Social Media Exposure\n';
  const pLabels={always:'Reuses all',sometimes:'Some overlap',never:'All unique',none:'No MFA',sms:'SMS only',app:'App/hardware',no:'None',browser:'Browser',dedicated:'Dedicated',click:'Clicks directly',hover:'Hovers first',navigate:'Navigates directly',yes:'Yes',maybe:'Possibly',lots:'Lots public',some:'Some basics',minimal:'Minimal/private'};

  });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='compliance_report_'+date+'.csv';a.click();
}

    <div class="stat"><span class="stat-val" style="color:var(--grn)">${started.length}</span><span class="stat-lbl">STARTED</span></div>

    <p style="font-size:.82rem;color:var(--tx2);margin-bottom:6px">Upload a CSV file with columns: <span style="font-family:var(--fM);color:var(--blue)">Name, Property, Email, DueBy</span></p>
    <p style="font-size:.78rem;color:var(--tx3);margin-bottom:12px">Only "Name" is required. Other columns are optional. First row should be headers.</p>
    <div class="csv-zone" onclick="document.getElementById('csvFileInput').click()">
      <input type="file" id="csvFileInput" accept=".csv,.txt" onchange="handleCSVUpload(event)">
      <p style="color:var(--tx2);font-size:.88rem">Click to select a CSV file</p>
      <p style="color:var(--tx3);font-size:.75rem;margin-top:4px">Format: Name, Property, Email, DueBy</p>

  // Sample CSV download

    <h4 style="margin-bottom:8px;font-family:var(--fD);font-size:.8rem">📥 DOWNLOAD CSV TEMPLATE</h4>

    <button class="btn bB bSm" onclick="downloadTemplate()">DOWNLOAD TEMPLATE</button>

  // Current enrollment roster with property

      const prop=p.property||'Unassigned';

function enrollOne(){
  const name=document.getElementById('enrollName').value.trim();
  const prop=document.getElementById('enrollProp').value.trim();
  const email=document.getElementById('enrollEmail').value.trim();
  const res=document.getElementById('enrollOneResult');
  if(!name){res.innerHTML='<span style="color:var(--red)">Name is required.</span>';return}

  const staff=[{name,property:prop,email}];
  fetch(API+'?action=enroll',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({staff})
  })
  .then(r=>r.json())
  .then(result=>{
    if(result.success){
      res.innerHTML=`<span style="color:var(--grn)">✓ ${name} enrolled successfully.</span>`;
      document.getElementById('enrollName').value='';
      document.getElementById('enrollEmail').value='';
      loadData(); // Refresh everything
    } else {
      res.innerHTML=`<span style="color:var(--red)">Error: ${result.error||'Unknown'}</span>`;
    }
  })
  .catch(e=>res.innerHTML=`<span style="color:var(--red)">Network error: ${e.message}</span>`);
}

function handleCSVUpload(event){
  const file=event.target.files[0];
  if(!file)return;
  const res=document.getElementById('csvResult');
  res.innerHTML='<span style="color:var(--amb)">Processing...</span>';

  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const text=e.target.result;
      const lines=text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){res.innerHTML='<span style="color:var(--red)">CSV must have a header row and at least one data row.</span>';return}

      // Parse header
      const header=lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/['"]/g,''));
      const nameIdx=header.findIndex(h=>h==='name'||h==='full name'||h==='employee');
      const propIdx=header.findIndex(h=>h==='property'||h==='location'||h==='site');
      const emailIdx=header.findIndex(h=>h==='email'||h==='e-mail'||h==='email address');
      const dueIdx=header.findIndex(h=>h==='dueby'||h==='due'||h==='due by'||h==='deadline'||h==='due date');

      if(nameIdx===-1){res.innerHTML='<span style="color:var(--red)">CSV must have a "Name" column.</span>';return}

      const staff=[];
      for(let i=1;i<lines.length;i++){
        // Simple CSV parse (handles quoted fields)
        const fields=parseCSVLine(lines[i]);
        const name=(fields[nameIdx]||'').trim();
        if(!name)continue;
        const entry={name};
        if(propIdx>=0&&fields[propIdx])entry.property=fields[propIdx].trim();
        if(emailIdx>=0&&fields[emailIdx])entry.email=fields[emailIdx].trim();
        if(dueIdx>=0&&fields[dueIdx])entry.dueBy=fields[dueIdx].trim();
        staff.push(entry);
      }

      if(staff.length===0){res.innerHTML='<span style="color:var(--red)">No valid rows found in CSV.</span>';return}

      // Preview
      res.innerHTML=`<span style="color:var(--amb)">Found ${staff.length} staff members. Enrolling...</span>`;

      fetch(API+'?action=enroll',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({staff})
      })
      .then(r=>r.json())
      .then(result=>{
        if(result.success){
          res.innerHTML=`<span style="color:var(--grn)">✓ Enrollment complete: ${result.added} added, ${result.updated} updated${result.skipped?' , '+result.skipped+' skipped':''}.</span>`;
          loadData();
        } else {
          res.innerHTML=`<span style="color:var(--red)">Error: ${result.error||'Unknown'}</span>`;
        }
      })
      .catch(e=>res.innerHTML=`<span style="color:var(--red)">Network error: ${e.message}</span>`);

    }catch(err){
      res.innerHTML=`<span style="color:var(--red)">Parse error: ${err.message}</span>`;
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function parseCSVLine(line){
  const fields=[];
  let current='';
  let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQuotes=!inQuotes}
    else if(c===','&&!inQuotes){fields.push(current);current=''}
    else{current+=c}
  }
  fields.push(current);
  return fields.map(f=>f.replace(/^["']|["']$/g,'').trim());
}
